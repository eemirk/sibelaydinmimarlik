; Dosya yükleme limitleri (form.php kendi sınırlarını ayrıca uygular). cPanel/LiteSpeed PHP bu dosyayı okur.
;   Projenizi Anlatın: dosya başı 15 MB, en fazla 10 dosya, toplam 25 MB
;   Kariyer başvurusu: CV 10 MB + portfolyo en fazla 3 dosya / toplam 20 MB (tek portfolyo dosyası 20 MB olabilir)
upload_max_filesize = 21M
post_max_size = 36M
max_file_uploads = 12
max_execution_time = 90
max_input_time = 120
memory_limit = 256M

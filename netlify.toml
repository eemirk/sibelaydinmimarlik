# ==========================================================================
#  Netlify — ÖNİZLEME ortamı (canlı site Veridyen cPanel'de; .htaccess orada geçerli)
#  Yayın klasörü dist/site; derleme tools/make-dist.mjs ile (?v= içerik hash'i + anahtar taraması)
# ==========================================================================

[build]
  command = "node tools/make-dist.mjs"
  publish = "dist/site"

[build.environment]
  NODE_VERSION = "20"

# --- Önizleme arama motorlarına kapalı -------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# --- Önbellek (.htaccess ile aynı mantık) ------------------------------------
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/seq/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# --- Eski site adresleri (.htaccess ile aynı) --------------------------------
[[redirects]]
  from = "/Icerik/Iletisim"
  to = "/iletisim/"
  status = 301
  force = true

[[redirects]]
  from = "/Icerik/Kurumsal"
  to = "/kurumsal/"
  status = 301
  force = true

[[redirects]]
  from = "/Icerik/Referanslar"
  to = "/projeler/"
  status = 301
  force = true

[[redirects]]
  from = "/Icerik/*"
  to = "/"
  status = 301
  force = true

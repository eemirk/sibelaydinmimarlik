# ==========================================================================
#  Netlify — ÖNİZLEME ortamı (canlı site Veridyen cPanel'de; .htaccess orada geçerli)
#  Yayın klasörü dist/site; derleme tools/make-dist.mjs ile (?v= içerik hash'i + anahtar taraması),
#  ardından tools/netlify-preview.mjs: api/ kaldırılır (PHP yok), form.php önizleme JSON'u döner, önizleme bandı eklenir
# ==========================================================================

[build]
  command = "node tools/make-dist.mjs && node tools/netlify-preview.mjs"
  publish = "dist/site"

# Önizlemede /api/form.php → sabit JSON yanıtı (POST dahil); tools/ yayın klasörüne kopyalanmaz
[functions]
  directory = "tools/netlify-functions"

[build.environment]
  NODE_VERSION = "20"

# --- Önizleme arama motorlarına kapalı -------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# --- /api: önizlemede PHP yok; api/form.php sabit JSON (tools/netlify-preview.mjs) ---
[[headers]]
  for = "/api/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "no-store"

# --- Önbellek (.htaccess ile aynı mantık) ------------------------------------
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/seq/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# --- Eski site adresleri (.htaccess ile aynı) --------------------------------
[[redirects]]
  from = "/Icerik/Iletisim"
  to = "/iletisim/"
  status = 301
  force = true

[[redirects]]
  from = "/Icerik/Kurumsal"
  to = "/kurumsal/"
  status = 301
  force = true

[[redirects]]
  from = "/Icerik/Referanslar"
  to = "/projeler/"
  status = 301
  force = true

# Ayrı randevu sayfası yok (randevu WhatsApp üzerinden) → iletişim
[[redirects]]
  from = "/randevu"
  to = "/iletisim/"
  status = 301
  force = true

[[redirects]]
  from = "/randevu/"
  to = "/iletisim/"
  status = 301
  force = true

[[redirects]]
  from = "/Icerik/*"
  to = "/"
  status = 301
  force = true
